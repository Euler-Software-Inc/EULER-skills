name: pages

# Publishes the docs landing (site/) + the showcase to GitHub Pages.
# Homepage: https://euler-software-inc.github.io/EULER-skills/

on:
  push:
    branches: [main]
    paths: ['site/**', 'showcase/index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (landing + showcase)
        run: |
          mkdir -p _site/showcase
          cp site/index.html _site/index.html
          cp showcase/index.html _site/showcase/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
